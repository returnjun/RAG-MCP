server:
  port: 8090

spring:
  # 1. AI 配置：与 datasource 平级，不要缩进到里面！
  ai:
    openai:
      base-url: https://api2.aigcbest.top
      api-key: sk-qN3s0oXo3UkMbQpfdB6GbxpaPXSRtcVR0ib3ic7X2jIIupMq
      embedding:
        options:
          model: text-embedding-3-small

    vectorstore:
      pgvector:
        initialize-schema: true
    ollama:
      base-url: http://82.157.190.244:11434
      embedding:
        model: nomic-embed-text # 你的 embedding 模型名称
        options:
          num-ctx: 2048  # <-- 加上这一行，限制上下文长度
        chat:
          options:
            num-ctx: 2048  # 建议把对话模型的上下文也同步限制一下
    rag:
      embed: nomic-embed-text

  # 2. 数据库配置
  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: Gong6666!
    url: jdbc:postgresql://82.157.190.244:5432/ai-rag-knowledge
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: HikariCP
      minimum-idle: 5
      idle-timeout: 600000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # 3. MVC 配置：同样与 datasource 平级
  mvc:
    async:
      request-timeout: 300000

# Redis
redis:
  sdk:
    config:
      host: redis
      port: 6379
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

logging:
  level:
    root: info
  config: classpath:logback-spring.xml